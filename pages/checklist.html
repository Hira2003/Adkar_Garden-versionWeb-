<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✅ قائمة المسلم اليومية | Adkar Garden</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <div class="app-container">
    <!-- Top Bar -->
    <div class="page-top-bar">
      <a href="../index.html" class="btn-back">‹ رجوع</a>
      <div class="page-title">✅ قائمة المسلم اليومية</div>
    </div>

    <!-- Progress Summary -->
    <div class="checklist-progress-summary">
      <span id="progressText">تم إنجاز 0 من 0</span>
      <div class="checklist-progress-bar">
        <div class="checklist-progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Scrollable Checklist -->
    <div class="scroll-area" id="checklistScrollArea" style="max-height: 60vh;">
      <div class="adkar-list" id="checklistContainer">
        <!-- Rendered dynamically via JavaScript -->
      </div>
    </div>

    <div class="reset-note">تُصفَّر القائمة تلقائيًا مع بداية كل يوم جديد 🌱</div>
  </div>

  <script src="checklist.js"></script>
</body>
</html>
